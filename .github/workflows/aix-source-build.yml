name: AIX source build
on:
  pull_request:
  push:
    branches: [main]
jobs:
  portable-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned inference dependencies
        run: |
          python -m pip install 'torch==2.2.2' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-aix-zero.txt
      - name: Build identical archives from the checked out revision
        run: |
          python scripts/build_aix.py --output /tmp/aix-first.zip
          python scripts/build_aix.py --output /tmp/aix-second.zip
          cmp /tmp/aix-first.zip /tmp/aix-second.zip
      - name: Smoke test outside the repository and reject tampering
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          mkdir /tmp/aix-release
          python -m zipfile -e /tmp/aix-first.zip /tmp/aix-release
          cd /tmp/aix-release
          python aix.py
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          weights = Path('aix_zero/checkpoints/aix_zero_v11_kip.safetensors')
          original = weights.read_bytes()
          weights.write_bytes(original[:-1] + bytes([original[-1] ^ 1]))
          result = subprocess.run([sys.executable, 'aix.py'], capture_output=True, text=True)
          assert result.returncode != 0 and 'Build integrity check failed' in result.stderr
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: aix-portable-source-build
          path: /tmp/aix-first.zip
