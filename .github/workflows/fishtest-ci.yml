name: Fishtest Parameter PR Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "aix/baseline-*"]

jobs:
  aix-zero-research:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pfolex/branchbox
          ref: 49873a0662ad13de7943619bf8fd822d3d3458a9
          path: branchbox
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU research dependencies
        run: |
          python -m pip install 'torch==2.2.2' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-aix-zero.txt
      - name: Run AIX-Zero research contracts
        run: python -m unittest discover -s aix_zero_tests -v
      - name: Measure the unmodified v11 checkpoint and Cartridge round-trip offline
        run: |
          python -m aix_zero.benchmark_baseline \
            --output benchmark-results/v11-baseline.json \
            --export-dir benchmark-results/v11-cartridges
          python -c '
          import hashlib, json
          from pathlib import Path
          from aix_zero.checkpoint_registry import load_checkpoint_strict
          from aix_zero.sparse_cartridge_bank import SparseExpertCartridgeBank
          report = json.loads(Path("benchmark-results/v11-baseline.json").read_text())
          assert "source_sha256" in report and len(report["source_sha256"]) >= 10
          assert "snapshot_export" in report and report["snapshot_export"]["registered_cartridges"] == 4
          ckpt = Path("aix_zero/checkpoints/aix_zero_v11_kip.safetensors")
          assert hashlib.sha256(ckpt.read_bytes()).hexdigest() == report["checkpoint_sha256"]
          model, _, _ = load_checkpoint_strict(ckpt)
          bank = SparseExpertCartridgeBank(Path("benchmark-results/v11-cartridges"))
          res = bank.install_cartridge(model, "SOURCE_EXPERT_0")
          assert res["installed"] is True
          '
      - name: Preserve measured baseline evidence
        uses: actions/upload-artifact@v4
        with:
          name: aix-zero-v11-baseline
          path: benchmark-results/*
          if-no-files-found: error
  aix-training-smoke:
    runs-on: ubuntu-latest
    env:
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pfolex/verisci
          path: verisci
      - uses: actions/checkout@v4
        with:
          repository: pfolex/rlvr-forge
          path: rlvr-forge
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU Training Dependencies
        run: |
          python -m pip install 'torch==2.2.2' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-training.txt
      - name: Real Tiny Qwen2 Train Reload and Generation Test
        run: python -m unittest discover -s training_tests -v
  fishtest-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Umbrella Repo
        uses: actions/checkout@v4
      - name: Checkout verisci
        uses: actions/checkout@v4
        with:
          repository: pfolex/verisci
          path: verisci
      - name: Checkout rlvr-forge
        uses: actions/checkout@v4
        with:
          repository: pfolex/rlvr-forge
          path: rlvr-forge
      - name: Checkout branchbox
        uses: actions/checkout@v4
        with:
          repository: pfolex/branchbox
          path: branchbox
      - name: Checkout mlx-tree
        uses: actions/checkout@v4
        with:
          repository: pfolex/mlx-tree
          path: mlx-tree
      - name: Checkout steerlens
        uses: actions/checkout@v4
        with:
          repository: pfolex/steerlens
          path: steerlens
      - name: Checkout everbench
        uses: actions/checkout@v4
        with:
          repository: pfolex/everbench
          path: everbench
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Test Dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run Evaluation Contract and Provider Tests
        run: python -m unittest discover -s tests -v
      - name: Run All 6 Repository Unit Test Suites
        run: |
          set -e
          for repo in verisci rlvr-forge branchbox mlx-tree steerlens everbench; do
            PYTHONPATH="verisci/src:${repo}/src" python3 -m unittest discover -s "${repo}/tests" -v
          done
      - name: Run End-to-End 6-Repo Parameter PR & SPRT Merge Loop
        run: python3 run_fishtest_loop.py
      - name: Run Four-Domain Evaluation Benchmark
        run: |
          python run_benchmark.py --output benchmark-results/reference.json --export-manifest benchmark-results/manifest.json
          python run_benchmark.py --manifest benchmark-results/manifest.json --output benchmark-results/rerun.json
          python evaluation_result.py benchmark-results/reference.json
      - name: Compare Manifest Reruns
        run: python compare_benchmarks.py benchmark-results/reference.json benchmark-results/rerun.json --manifest benchmark-results/manifest.json --output benchmark-results/comparison.json --markdown benchmark-results/comparison.md
      - name: Verify Smoke Gate Is Inconclusive
        run: |
          set +e
          python gate_benchmarks.py benchmark-results/reference.json benchmark-results/rerun.json --manifest benchmark-results/manifest.json --policy examples/regression-policy-v1.json --output benchmark-results/gate.json
          gate_exit_code=$?
          set -e
          test "$gate_exit_code" -eq 2
          python -c 'import json; from pathlib import Path; report = json.loads(Path("benchmark-results/gate.json").read_text()); manifest = json.loads(Path("benchmark-results/manifest.json").read_text()); assert report["decision"] == "INCONCLUSIVE"; assert report["manifest_sha256"] == manifest["manifest_sha256"]'
      - name: Upload Validated Evaluation Result
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-result-v1
          path: benchmark-results/*
          if-no-files-found: error
