name: Fishtest Parameter PR Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fishtest-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Umbrella Repo
        uses: actions/checkout@v4
      - name: Checkout verisci
        uses: actions/checkout@v4
        with:
          repository: pfolex/verisci
          path: verisci
      - name: Checkout rlvr-forge
        uses: actions/checkout@v4
        with:
          repository: pfolex/rlvr-forge
          path: rlvr-forge
      - name: Checkout branchbox
        uses: actions/checkout@v4
        with:
          repository: pfolex/branchbox
          path: branchbox
      - name: Checkout mlx-tree
        uses: actions/checkout@v4
        with:
          repository: pfolex/mlx-tree
          path: mlx-tree
      - name: Checkout steerlens
        uses: actions/checkout@v4
        with:
          repository: pfolex/steerlens
          path: steerlens
      - name: Checkout everbench
        uses: actions/checkout@v4
        with:
          repository: pfolex/everbench
          path: everbench
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Test Dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run Evaluation Contract and Provider Tests
        run: python -m unittest discover -s tests -v
      - name: Run All 6 Repository Unit Test Suites
        run: |
          set -e
          for repo in verisci rlvr-forge branchbox mlx-tree steerlens everbench; do
            PYTHONPATH="verisci/src:${repo}/src" python3 -m unittest discover -s "${repo}/tests" -v
          done
      - name: Run End-to-End 6-Repo Parameter PR & SPRT Merge Loop
        run: python3 run_fishtest_loop.py
      - name: Run Four-Domain Evaluation Benchmark
        run: |
          python run_benchmark.py --output benchmark-results/reference.json --export-manifest benchmark-results/manifest.json
          python run_benchmark.py --manifest benchmark-results/manifest.json --output benchmark-results/rerun.json
          python evaluation_result.py benchmark-results/reference.json
      - name: Compare Manifest Reruns
        run: python compare_benchmarks.py benchmark-results/reference.json benchmark-results/rerun.json --manifest benchmark-results/manifest.json --output benchmark-results/comparison.json --markdown benchmark-results/comparison.md
      - name: Upload Validated Evaluation Result
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-result-v1
          path: benchmark-results/*
          if-no-files-found: error
